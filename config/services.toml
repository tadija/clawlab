[caddy]
AELAB_SERVICE_ID = "caddy"
AELAB_SERVICE_DESCRIPTION = "Caddy web server"
AELAB_SERVICE_BIN = "caddy"
AELAB_SERVICE_BREW_PACKAGES = "caddy"
AELAB_SERVICE_USER = "__AELAB_USER__"
AELAB_SERVICE_GROUP = "__AELAB_GROUP__"
AELAB_SERVICE_WORKING_DIRECTORY = "__AELAB_ROOT__/infra"
AELAB_SERVICE_ENV = "HOME=__AELAB_SERVICE_DIR__/home|XDG_DATA_HOME=__AELAB_SERVICE_DIR__|XDG_CONFIG_HOME=__AELAB_SERVICE_DIR__/config"
AELAB_SERVICE_ARGS = "run --config \"__AELAB_ROOT__/infra/generated/Caddyfile\" --adapter caddyfile"
AELAB_SERVICE_RELOAD_ARGS = "reload --config \"__AELAB_ROOT__/infra/generated/Caddyfile\" --adapter caddyfile"
AELAB_SERVICE_AFTER = "network-online.target"
AELAB_SERVICE_WANTS = "network-online.target"
AELAB_SERVICE_STATE_DIRS = "__AELAB_SERVICE_DIR__/home __AELAB_SERVICE_DIR__/config/caddy __AELAB_SERVICE_DIR__/caddy/locks __AELAB_ROOT__/infra/generated"
AELAB_SERVICE_SYSTEMD_AMBIENT_CAPABILITIES = "CAP_NET_BIND_SERVICE"
AELAB_SERVICE_SYSTEMD_CAPABILITY_BOUNDING_SET = "CAP_NET_BIND_SERVICE"
AELAB_SERVICE_SYSTEMD_NO_NEW_PRIVILEGES = "true"

[core-http]
AELAB_SERVICE_ID = "core-http"
AELAB_SERVICE_DESCRIPTION = "aelab HTTP server"
AELAB_SERVICE_BIN = "__AELAB_ROOT__/infra/generated/bin/aelab-http"
AELAB_SERVICE_INSTALL_KIND = "script"
AELAB_SERVICE_INSTALL_SCRIPT = "infra/utils/installers/core-http.sh"
AELAB_SERVICE_WORKING_DIRECTORY = "__AELAB_ROOT__"
AELAB_SERVICE_ARGS = "--repo-root \"__AELAB_ROOT__\" --bind 127.0.0.1 --port __SERVICE_PORT__"
AELAB_SERVICE_AFTER = "network-online.target"
AELAB_SERVICE_WANTS = "network-online.target"
AELAB_SERVICE_USER = "__AELAB_USER__"
AELAB_SERVICE_GROUP = "__AELAB_GROUP__"
AELAB_SERVICE_CADDY_ROUTE = "/"
AELAB_SERVICE_CADDY_UPSTREAM = "127.0.0.1:__SERVICE_PORT__"

[core-tty]
AELAB_SERVICE_ID = "core-tty"
AELAB_SERVICE_DESCRIPTION = "aelab TTY stream server"
AELAB_SERVICE_BIN = "__AELAB_ROOT__/infra/generated/bin/aelab-tty"
AELAB_SERVICE_INSTALL_KIND = "script"
AELAB_SERVICE_INSTALL_SCRIPT = "infra/utils/installers/core-tty.sh"
AELAB_SERVICE_WORKING_DIRECTORY = "__AELAB_ROOT__"
AELAB_SERVICE_ARGS = "--repo-root \"__AELAB_ROOT__\" --bind 127.0.0.1 --port __SERVICE_PORT__"
AELAB_SERVICE_AFTER = "network-online.target"
AELAB_SERVICE_WANTS = "network-online.target"
AELAB_SERVICE_USER = "__AELAB_USER__"
AELAB_SERVICE_GROUP = "__AELAB_GROUP__"
AELAB_SERVICE_CADDY_ROUTE = "/tty"
AELAB_SERVICE_CADDY_UPSTREAM = "127.0.0.1:__SERVICE_PORT__"

[core]
AELAB_SERVICE_ID = "core"
AELAB_SERVICE_DESCRIPTION = "aelab core"
AELAB_SERVICE_GROUP_MEMBERS = "core-http core-tty caddy"
AELAB_SERVICE_BREW_PACKAGES = "swift"

[mongodb]
AELAB_SERVICE_ID = "mongodb"
AELAB_SERVICE_DESCRIPTION = "MongoDB server"
AELAB_SERVICE_BIN = "__AELAB_ROOT__/infra/utils/launchers/mongodb-server.sh"
AELAB_SERVICE_BREW_TAPS = "mongodb/brew"
AELAB_SERVICE_BREW_PACKAGES = "mongodb/brew/mongodb-community@8.0"
AELAB_SERVICE_AFTER = "network-online.target"
AELAB_SERVICE_WANTS = "network-online.target"
AELAB_SERVICE_ARGS = "--port __SERVICE_PORT__"
AELAB_SERVICE_STATE_DIRS = "__AELAB_SERVICE_DIR__/data"
AELAB_SERVICE_USER = "__AELAB_USER__"
AELAB_SERVICE_GROUP = "__AELAB_GROUP__"

[mysql]
AELAB_SERVICE_ID = "mysql"
AELAB_SERVICE_DESCRIPTION = "MySQL server"
AELAB_SERVICE_BIN = "__AELAB_ROOT__/infra/utils/launchers/mysql-server.sh"
AELAB_SERVICE_BREW_PACKAGES = "mysql"
AELAB_SERVICE_AFTER = "network-online.target"
AELAB_SERVICE_WANTS = "network-online.target"
AELAB_SERVICE_ARGS = "--port __SERVICE_PORT__"
AELAB_SERVICE_STATE_DIRS = "__AELAB_SERVICE_DIR__/data"
AELAB_SERVICE_USER = "__AELAB_USER__"
AELAB_SERVICE_GROUP = "__AELAB_GROUP__"

[nats]
AELAB_SERVICE_ID = "nats"
AELAB_SERVICE_DESCRIPTION = "NATS server"
AELAB_SERVICE_BIN = "nats-server"
AELAB_SERVICE_BREW_PACKAGES = "nats-server"
AELAB_SERVICE_ARGS = "-a 127.0.0.1 -p __SERVICE_PORT__ -m 8222 -js -sd \"__AELAB_SERVICE_DIR__/jetstream\" -P \"__AELAB_SERVICE_DIR__/nats-server.pid\""
AELAB_SERVICE_AFTER = "network-online.target"
AELAB_SERVICE_WANTS = "network-online.target"
AELAB_SERVICE_STATE_DIRS = "__AELAB_SERVICE_DIR__/jetstream"
AELAB_SERVICE_USER = "__AELAB_USER__"
AELAB_SERVICE_GROUP = "__AELAB_GROUP__"

[postgres]
AELAB_SERVICE_ID = "postgres"
AELAB_SERVICE_DESCRIPTION = "PostgreSQL server"
AELAB_SERVICE_BIN = "__AELAB_ROOT__/infra/utils/launchers/postgres-server.sh"
AELAB_SERVICE_BREW_PACKAGES = "postgresql"
AELAB_SERVICE_AFTER = "network-online.target"
AELAB_SERVICE_WANTS = "network-online.target"
AELAB_SERVICE_ARGS = "--port __SERVICE_PORT__"
AELAB_SERVICE_STATE_DIRS = "__AELAB_SERVICE_DIR__/data"
AELAB_SERVICE_USER = "__AELAB_USER__"
AELAB_SERVICE_GROUP = "__AELAB_GROUP__"

[tailscale]
AELAB_SERVICE_ID = "tailscale"
AELAB_SERVICE_DESCRIPTION = "Tailscale node agent"
AELAB_SERVICE_BIN = "tailscaled"
AELAB_SERVICE_BREW_PACKAGES = "tailscale"
AELAB_SERVICE_ARGS = "--state=\"__AELAB_SERVICE_DIR__/tailscaled.state\""
AELAB_SERVICE_STOP_COMMAND = "/bin/sh -c 'pkill -TERM -x tailscaled || true'"
AELAB_SERVICE_AFTER = "network-online.target"
AELAB_SERVICE_WANTS = "network-online.target"
AELAB_SERVICE_RESTART_SEC = "5s"
